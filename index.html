<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Metin2 Legends - Cadastro</title>
    <!-- Fontes do Google: Cinzel (fantasia/épico) e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-container">
        <!-- Banner no Topo -->
        <header class="banner-header">
            <div class="banner-wrapper">
                <img src="banner.jpg" alt="Metin2 Legends Banner" class="banner-img">
                <div class="banner-fade"></div>
            </div>
            <div class="banner-divider">
                <div class="divider-line"></div>
                <div class="divider-gem">◆</div>
                <div class="divider-line"></div>
            </div>
        </header>

        <!-- Área Principal com o Formulário -->
        <main class="main-wrapper">
            <div class="card-container">
                <div class="card-header">
                    <h1 class="card-title">CRIAR CONTA</h1>
                    <p class="card-subtitle">Junte-se à batalha em Metin2 Legends</p>
                </div>

                <form id="meuForm" novalidate>
                    <div class="form-group">
                        <div class="label-row">
                            <label for="login">Login da Conta:</label>
                            <div class="tooltip-wrapper" tabindex="0" aria-describedby="tooltip-login">
                                <span class="tooltip-icon" aria-label="Informação sobre o campo de login">?</span>
                                <div class="tooltip-content" id="tooltip-login" role="tooltip">
                                    <span class="tooltip-arrow"></span>
                                    O login precisa ter de 4 a 8 caracteres.
                                </div>
                            </div>
                        </div>
                        <input type="text" id="login" name="entry.1055462881"
                            placeholder="Seu login no jogo (4 a 8 caracteres)" required autocomplete="username"
                            maxlength="8">
                        <span class="error-msg" id="error-login"></span>
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="entry.348290478" placeholder="Sua senha secreta"
                            required autocomplete="new-password">
                        <span class="error-msg" id="error-senha"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="entry.966180966" placeholder="exemplo@email.com" required
                            autocomplete="email">
                        <span class="error-msg" id="error-email"></span>
                    </div>

                    <div class="form-group">
                        <label for="safebox">Código do Personagem (Armazém / Deleção):</label>
                        <input type="text" id="safebox" name="entry.1245374036"
                            placeholder="Código de segurança (ex: 7 dígitos)" required>
                        <span class="error-msg" id="error-safebox"></span>
                    </div>

                    <div class="form-group">
                        <label for="origem">Como você conheceu nosso servidor?</label>
                        <select id="origem" name="entry.856170902" required>
                            <option value="" disabled selected>Selecione uma opção...</option>
                            <option value="YouTube / Twitch (Lives ou Vídeos)">YouTube / Twitch (Lives ou Vídeos)
                            </option>
                            <option value="Instagram / TikTok">Instagram / TikTok</option>
                            <option value="Discord">Discord</option>
                            <option value="Indicação de Amigos">Indicação de Amigos</option>
                            <option value="Grupos / Fóruns de Metin2">Grupos / Fóruns de Metin2</option>
                            <option value="Pesquisa no Google">Pesquisa no Google</option>
                            <option value="Outros">Outros</option>
                        </select>
                        <span class="error-msg" id="error-origem"></span>
                    </div>

                    <button type="submit" id="btnEnviar">Cadastrar</button>
                </form>
            </div>

            <!-- Botão de Download do Cliente -->
            <div class="download-wrapper">
                <a id="btnDownload" class="btn-download" href="#" target="_blank" rel="noopener noreferrer"
                    aria-label="Baixar o cliente do jogo Metin2 Legends">
                    <span class="btn-download-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                    </span>
                    <span class="btn-download-text">
                        <span class="btn-download-label">BAIXAR O JOGO</span>
                        <span class="btn-download-sub">Cliente Metin2 Legends — Grátis</span>
                    </span>
                </a>
            </div>
        </main>

        <!-- Rodapé -->
        <footer class="site-footer">
            <div class="footer-divider">
                <div class="divider-line"></div>
                <div class="divider-gem">◆</div>
                <div class="divider-line"></div>
            </div>

            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo-text">METIN2 LEGENDS</span>
                    <p class="footer-tagline">O servidor que revive a lenda.</p>
                </div>

                <div class="footer-links">
                    <a href="#" class="footer-link" aria-label="Discord do servidor">
                        <!-- Discord -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" />
                        </svg>
                        <span>Discord</span>
                    </a>
                    <a href="#" class="footer-link" aria-label="YouTube do servidor">
                        <!-- YouTube -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                        </svg>
                        <span>YouTube</span>
                    </a>
                    <a href="#" class="footer-link" aria-label="Instagram do servidor">
                        <!-- Instagram -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z" />
                        </svg>
                        <span>Instagram</span>
                    </a>
                </div>
            </div>

            <div class="footer-bottom">
                <p class="footer-copyright">
                    &copy; <span id="footer-year"></span> Metin2 Legends &mdash; Todos os direitos reservados.
                </p>
                <p class="footer-disclaimer">
                    Servidor privado não oficial.
                </p>
            </div>
        </footer>
    </div>

    <!-- Modal de Feedback -->
    <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
        <div class="modal-card">
            <div id="modalIcon" class="modal-icon"></div>
            <h3 id="modalTitle" class="modal-title"></h3>
            <p id="modalMessage" class="modal-message"></p>
            <button type="button" id="modalBtnClose" class="modal-btn">Fechar</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('footer-year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
