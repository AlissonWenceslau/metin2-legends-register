<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="meuForm">

            <option value="YouTube / Twitch (Lives ou Vídeos)">YouTube / Twitch (Lives ou Vídeos)</option>
            <option value="Instagram / TikTok">Instagram / TikTok</option>

            <option value="Indicação de Amigos">Indicação de Amigos</option>
            <option value="Grupos / Fóruns de Metin2">Grupos / Fóruns de Metin2</option>
            <option value="Pesquisa no Google">Pesquisa no Google</option>
            <option value="Outros">Outros</option>
        </select>

        <label>Login:</label>
        <input type="text" name="entry.1055462881" placeholder="Seu login" required>

        <label>Senha:</label>
        <input type="password" name="entry.348290478" placeholder="Sua senha" required>

        <label>E-mail:</label>
        <input type="email" name="entry.966180966" placeholder="Seu e-mail" required>

        <label>Senha do Personagem:</label>
        <input type="text" name="entry.1245374036" placeholder="Senha do Personagem" required>

        <button type="submit" id="btnEnviar">Cadastrar</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
