<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 320px;
            gap: 12px;
        }

        input,
        button {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border, #ccc);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
            font-size: 14px;
            color: var(--text, #1e293b);
            transition: border-color 0.2s;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--primary, #6366f1);
        }
    </style>
</head>

<body>

    <form id="meuForm">
        <label for="origem">Como você conheceu nosso servidor?</label>
        <select id="origem" name="entry.856170902" required>
            <option value="" disabled selected>Selecione uma opção...</option>
            <option value="YouTube / Twitch (Lives ou Vídeos)">YouTube / Twitch (Lives ou Vídeos)</option>
            <option value="Instagram / TikTok">Instagram / TikTok</option>
            <option value="Discord">Discord</option>
            <option value="Indicação de Amigos">Indicação de Amigos</option>
            <option value="Grupos / Fóruns de Metin2">Grupos / Fóruns de Metin2</option>
            <option value="Pesquisa no Google">Pesquisa no Google</option>
            <option value="Outros">Outros</option>
        </select>

        <label>Login:</label>
        <input type="text" name="entry.1055462881" placeholder="Seu login" required>

        <label>Senha:</label>
        <input type="password" name="entry.348290478" placeholder="Sua senha" required>

        <label>E-mail:</label>
        <input type="email" name="entry.966180966" placeholder="Seu e-mail" required>

        <label>Senha do Personagem:</label>
        <input type="text" name="entry.1245374036" placeholder="Senha do Personagem" required>

        <button type="submit" id="btnEnviar">Cadastrar</button>
    </form>

    <script>
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfArkU7sRQorkxKbgFoqx6lEJYtb3drH4CvcjT6N9PuOTKq1A/formResponse";

        const form = document.getElementById('meuForm');
        const btn = document.getElementById('btnEnviar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            btn.disabled = true;
            btn.innerText = "Enviando...";

            // 1. Converte os dados para o formato URL Encoded que o Forms exige
            const formData = new FormData(form);
            const urlParams = new URLSearchParams();

            for (const [key, value] of formData.entries()) {
                urlParams.append(key, value);
            }

            // 2. Flags internas obrigatórias do Google Forms para aceitar envio direto de todas as seções
            urlParams.append("fvv", "1");
            urlParams.append("pageHistory", "0,1"); // Pula a validação de etapas entre a seção 1 e 2

            try {
                await fetch(GOOGLE_FORM_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: urlParams.toString()
                });

                alert("✅ Enviado com sucesso!");
                form.reset();
            } catch (err) {
                console.error("Erro no envio:", err);
                alert("❌ Falha no envio.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Cadastrar";
            }
        });
    </script>

</body>

</html>
